server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    # 'native' = serve config from the filesystem/classpath instead of a git repo.
    # Simplest thing that satisfies the requirement; swap for a git backend later.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info
