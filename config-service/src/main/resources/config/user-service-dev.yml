# DEV profile for user-service, served by the config service.

lms:
  environment-label: "DEV - served by config-service (schema auto-created, SQL logging on, seed data loaded)"

spring:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always

logging:
  level:
    edu.lms: DEBUG
