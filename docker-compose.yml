# Local compose. Bring up only what you own:
#
#   docker compose up --build user-service
#
# postgres and config-service start automatically as dependencies.
# Services you haven't generated yet are listed but never built unless named.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks: [lh-internal]

  # Spring Cloud Config Server.
  config-service:
    build: ./config-service
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    networks: [lh-internal]
    restart: unless-stopped

  user-service:
    build: ./user-service
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8101
      CONFIG_URL: http://config-service:8888
      EUREKA_ENABLED: "false"
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks: [lh-internal]
    restart: unless-stopped


  schedule-service:
    build: ./schedule-service
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/scheduledb
      DB_USER: ${DB_USER}
